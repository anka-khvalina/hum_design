services:
  backend:
    build: ./human-design-service
    ports:
      - "8000:8000"
    env_file:
      - ./human-design-service/.env
    environment:
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8000}
      - MINI_APP_URL=${MINI_APP_URL:-http://localhost:5173}
      - DEMO_MODE=${DEMO_MODE:-auto}
    volumes:
      - ./human-design-service/knowledge:/app/knowledge:ro
      - ./human-design-service/fixtures:/app/fixtures:ro

  mini-app:
    build:
      context: ./mini-app
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      - backend
